<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test-top-type</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="mainContainer" >
        <div id="leftPanel" >
          <div id="displayText"> Tap the Generate New Button to Start typing </div>
          <textarea id="typingInput" placeholder="Start typing..."></textarea>
          <div>
            <button id="btn">Generate New</button>
          </div>
        </div>
      
        <div id="rightPanel" >
          <span>Time</span>
          <div id="timerDisplay">2:30</div>
          <div>
            <div>Speed</div>
            <div id="speedDisplay">0 wpm</div>
          </div>
          <div>
            <div>Accuracy</div>
            <div id="Accuracy">0 %</div>
          </div>
        </div>
      </div>



      <script src="script.js"></script>
</body>
</html>
